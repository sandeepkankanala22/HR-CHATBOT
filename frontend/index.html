<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>HR Chatbot</h1>
      <p>Upload an HR PDF and ask questions about it.</p>
    </header>

    <section class="upload-section card">
      <h2>1. Upload Document</h2>
      <div class="upload-row">
        <input type="file" id="pdfInput" accept=".pdf" />
        <button id="uploadBtn" type="button">Upload PDF</button>
      </div>
      <p id="uploadStatus" class="status">No document uploaded yet.</p>
    </section>

    <section class="chat-section card">
      <h2>2. Ask a Question</h2>
      <div id="chatHistory" class="chat-history">
        <div class="message bot">
          <strong>Assistant:</strong>
          <span>Hello! Upload an HR policy PDF, then ask me anything about it.</span>
        </div>
      </div>

      <div class="chat-input-row">
        <input
          type="text"
          id="questionInput"
          placeholder="Example: How many leave days do employees get?"
          autocomplete="off"
        />
        <button id="askBtn" type="button">Ask</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
